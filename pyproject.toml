[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geolip-nano-beatrix-trainer"
version = "0.1.21"
description = "The nano Beatrix trainer: small byte-level aleph crafts trained from birth to measure what they hold (planted records, frames, byte experts) and how fast they train"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AbstractPhil" }]
dependencies = [
  "torch==2.11.0",
  "numpy==2.5.3",
  "safetensors==0.8.0",
  "huggingface_hub==1.31.0",
  "tqdm==4.70.1",
  "geolip-alephllm @ git+https://github.com/AbstractEyes/alephllm@d3c7eda",
]

[project.optional-dependencies]
corpus = ["datasets==5.0.1"]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["geolip*"]
namespaces = true
